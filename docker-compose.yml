version: "3.8"

services:
  postgres:
    image: postgres:16
    container_name: financeflow_db
    restart: always
    environment:
      POSTGRES_USER: financeflow_user
      POSTGRES_PASSWORD: financeflow_pass
      POSTGRES_DB: financeflow_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
